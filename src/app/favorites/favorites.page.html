<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Favorites</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (favoritesService.favorites.length === 0) {
    <div class="empty-wrap">
      <ion-icon name="heart-outline"></ion-icon>
      <p>No favorites yet. Tap the heart on any recipe to save it here.</p>
    </div>
  } @else {
    <ion-list>
      @for (meal of favoritesService.favorites; track meal.idMeal) {
        <ion-item-sliding>
          <ion-item button (click)="openRecipe(meal.idMeal)">
            <ion-thumbnail slot="start">
              <ion-img [src]="meal.strMealThumb" [alt]="meal.strMeal"></ion-img>
            </ion-thumbnail>
            <ion-label>{{ meal.strMeal }}</ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="removeFavorite(meal)">
              <ion-icon slot="icon-only" name="heart-dislike-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }
</ion-content>
