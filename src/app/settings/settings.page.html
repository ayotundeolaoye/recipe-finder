<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset="true">
    <ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-label>Dark mode</ion-label>
      <ion-toggle slot="end" [(ngModel)]="darkModeEnabled" (ionChange)="onToggleDarkMode()"></ion-toggle>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-item button (click)="clearFavorites()">
      <ion-icon slot="start" name="trash-outline" color="danger"></ion-icon>
      <ion-label color="danger">Clear favorites</ion-label>
    </ion-item>
    <ion-item button (click)="clearCookingLog()">
      <ion-icon slot="start" name="trash-outline" color="danger"></ion-icon>
      <ion-label color="danger">Clear cooking log</ion-label>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-item lines="none">
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label class="ion-text-wrap">
        <h3>Recipe Finder</h3>
        <p>Recipe data courtesy of TheMealDB. Built with Ionic and Angular standalone components.</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
